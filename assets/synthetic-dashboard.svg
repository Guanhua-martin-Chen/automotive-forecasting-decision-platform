  <text x="757" y="246" class="panel-title">Brand Planning Context</text><text x="757" y="267" class="small">Illustrative Revenue contribution · Wholesale scale · per-vehicle context</text>
  <text x="772" y="302" class="table-head">BRAND</text><text x="955" y="302" class="table-head">REVENUE</text><text x="1082" y="302" class="table-head">WHOLESALE</text><text x="1242" y="302" class="table-head">PNVW</text>
  <line x1="757" y1="314" x2="1374" y2="314" stroke="#e2e8f0"/>
  <g class="table">
    <text x="772" y="344">Brand A</text><rect x="850" y="333" width="78" height="10" rx="5" fill="#2563eb"/><text x="955" y="344">$10.6M</text><text x="1082" y="344">High</text><text x="1242" y="344">$286</text>
    <text x="772" y="382">Brand B</text><rect x="850" y="371" width="57" height="10" rx="5" fill="#06b6d4"/><text x="955" y="382">$7.8M</text><text x="1082" y="382">Medium</text><text x="1242" y="382">$241</text>
    <text x="772" y="420">Brand C</text><rect x="850" y="409" width="41" height="10" rx="5" fill="#8b5cf6"/><text x="955" y="420">$5.4M</text><text x="1082" y="420">Focused</text><text x="1242" y="420">$198</text>
  </g>
  <rect x="757" y="440" width="617" height="27" rx="6" fill="#f8fafc"/><text x="772" y="458" class="small">All values are fabricated for illustrative planning context only.</text>

  <!-- Model planning -->
  <rect x="46" y="505" width="438" height="165" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="66" y="535" class="panel-title">Model Planning</text><text x="66" y="555" class="small">Synthetic vehicle-model decision detail</text>
  <text x="66" y="582" class="table-head">MODEL</text><text x="238" y="582" class="table-head">REVENUE SIGNAL</text><text x="405" y="582" class="table-head">TREND</text>
  <line x1="66" y1="592" x2="463" y2="592" stroke="#e2e8f0"/>
  <g class="table"><text x="66" y="618">Model A</text><text x="238" y="618">$8.6M · synthetic</text><text x="410" y="618" fill="#16a34a">↑</text><text x="66" y="644">Model B</text><text x="238" y="644">$6.2M · synthetic</text><text x="410" y="644" fill="#64748b">→</text><text x="66" y="660">Model C</text><text x="238" y="660">$4.1M · synthetic</text><text x="410" y="660" fill="#dc2626">↓</text></g>


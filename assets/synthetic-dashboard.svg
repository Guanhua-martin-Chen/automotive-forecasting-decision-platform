  <g><rect x="92" y="468" width="10" height="10" rx="2" fill="#2563eb"/><text x="108" y="477" class="small">Brand A</text><rect x="170" y="468" width="10" height="10" rx="2" fill="#06b6d4"/><text x="186" y="477" class="small">Brand B</text><rect x="248" y="468" width="10" height="10" rx="2" fill="#8b5cf6"/><text x="264" y="477" class="small">Brand C</text></g>

  <!-- Brand context panel -->

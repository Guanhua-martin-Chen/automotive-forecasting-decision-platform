  <text x="520" y="584" class="table-head">CATEGORY</text><text x="720" y="584" class="table-head">RELATIVE SIGNAL</text>
  <g><text x="520" y="612" class="table">Category A</text><rect x="642" y="601" width="180" height="12" rx="6" fill="#dbeafe"/><rect x="642" y="601" width="144" height="12" rx="6" fill="#2563eb"/><text x="838" y="612" class="small">Illustrative</text>
    <text x="520" y="640" class="table">Category B</text><rect x="642" y="629" width="180" height="12" rx="6" fill="#cffafe"/><rect x="642" y="629" width="105" height="12" rx="6" fill="#06b6d4"/>
    <text x="520" y="664" class="table">Category C</text><rect x="642" y="653" width="180" height="12" rx="6" fill="#ede9fe"/><rect x="642" y="653" width="69" height="12" rx="6" fill="#8b5cf6"/></g>

  <!-- Movers -->
  <rect x="954" y="505" width="440" height="165" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="974" y="535" class="panel-title">Top Movers</text><text x="974" y="555" class="small">Illustrative change drivers for decision support</text>
  <rect x="974" y="576" width="400" height="25" rx="5" fill="#f0fdf4"/><text x="988" y="593" class="table">Category A</text><text x="1348" y="593" text-anchor="end" class="value" fill="#16a34a">+$420K</text>
  <rect x="974" y="609" width="400" height="25" rx="5" fill="#f0fdf4"/><text x="988" y="626" class="table">Category B</text><text x="1348" y="626" text-anchor="end" class="value" fill="#16a34a">+$180K</text>
  <rect x="974" y="642" width="400" height="25" rx="5" fill="#fef2f2"/><text x="988" y="659" class="table">Category C</text><text x="1348" y="659" text-anchor="end" class="value" fill="#dc2626">-$120K</text>

  <!-- Governed workflow strip -->
  <rect x="46" y="690" width="1348" height="78" rx="10" fill="#102a56"/>
  <text x="68" y="719" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">Governed release workflow</text>
  <text x="68" y="742" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">One approved source for API, Dashboard, and controlled delivery</text>
  <g font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    <rect x="356" y="714" width="132" height="30" rx="15" fill="#1e40af"/><text x="422" y="734" fill="#fff">Validated</text><text x="502" y="734" fill="#93c5fd">→</text>
    <rect x="516" y="714" width="132" height="30" rx="15" fill="#1e40af"/><text x="582" y="734" fill="#fff">Forecasted</text><text x="662" y="734" fill="#93c5fd">→</text>
    <rect x="676" y="714" width="132" height="30" rx="15" fill="#1e40af"/><text x="742" y="734" fill="#fff">Reconciled</text><text x="822" y="734" fill="#93c5fd">→</text>
    <rect x="836" y="714" width="132" height="30" rx="15" fill="#166534"/><text x="902" y="734" fill="#fff">QA Passed</text><text x="982" y="734" fill="#86efac">→</text>
    <rect x="996" y="714" width="132" height="30" rx="15" fill="#2563eb"/><text x="1062" y="734" fill="#fff">Approved</text>
  </g>
  <text x="1370" y="744" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">SYNTHETIC VALUES · ILLUSTRATIVE ONLY</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" role="img" aria-labelledby="title description">
  <title id="title">Synthetic PIO Forecast Decision Platform dashboard</title>
  <desc id="description">A public-safe, fictional forecasting decision workspace with forecast time semantics, brand context, model planning, PLC planning, movers, and governed release status.</desc>
  <style>
    .title { font: 700 22px Arial, sans-serif; fill: #0f172a; }
    .header { font: 700 20px Arial, sans-serif; fill: #fff; }
    .subheader { font: 14px Arial, sans-serif; fill: #cbd5e1; }
    .panel-title { font: 700 17px Arial, sans-serif; fill: #0f172a; }
    .label { font: 600 13px Arial, sans-serif; fill: #475569; }
    .small { font: 12px Arial, sans-serif; fill: #64748b; }
    .metric { font: 700 27px Arial, sans-serif; fill: #0f172a; }
    .value { font: 700 15px Arial, sans-serif; fill: #1e293b; }
    .table-head { font: 700 11px Arial, sans-serif; fill: #64748b; letter-spacing: .6px; }
    .table { font: 13px Arial, sans-serif; fill: #334155; }
    .chip { font: 700 11px Arial, sans-serif; }
  </style>

  <rect width="1440" height="810" fill="#e2e8f0"/>
  <rect x="20" y="18" width="1400" height="774" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>

  <!-- Compact application header -->
  <path d="M36 18H1404A16 16 0 0 1 1420 34V86H20V34A16 16 0 0 1 36 18Z" fill="#102a56"/>
  <rect x="50" y="38" width="28" height="28" rx="7" fill="#2563eb"/>
  <path d="M58 57h12M64 47v20" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="92" y="50" class="header">PIO Forecast Decision Platform</text>
  <text x="92" y="70" class="subheader">Synthetic Planning Workspace</text>
  <rect x="967" y="37" width="130" height="29" rx="14" fill="#dbeafe"/>
  <circle cx="985" cy="51.5" r="5" fill="#2563eb"/>
  <text x="997" y="55" class="chip" fill="#1e3a8a">APPROVED RUN</text>
  <rect x="1110" y="37" width="109" height="29" rx="14" fill="#dcfce7"/>
  <circle cx="1128" cy="51.5" r="5" fill="#16a34a"/>
  <text x="1140" y="55" class="chip" fill="#166534">QA PASSED</text>
  <rect x="1231" y="37" width="139" height="29" rx="14" fill="#fef3c7"/>
  <text x="1247" y="55" class="chip" fill="#92400e">H1 WAPE 7.3%</text>
  <text x="1371" y="75" text-anchor="end" class="small" fill="#cbd5e1">SYNTHETIC DEMO</text>

  <!-- KPI row -->
  <g>
    <rect x="46" y="106" width="325" height="92" rx="10" fill="#fff" stroke="#cbd5e1"/>
    <text x="66" y="132" class="label">CURRENT MONTH</text><text x="66" y="160" class="metric">$24.8M</text>
    <rect x="207" y="119" width="74" height="20" rx="10" fill="#fff7ed"/><text x="244" y="133" text-anchor="middle" class="chip" fill="#9a3412">NOWCAST</text>
    <text x="66" y="182" class="small">Synthetic Revenue outlook</text>

    <rect x="387" y="106" width="325" height="92" rx="10" fill="#fff" stroke="#cbd5e1"/>
    <text x="407" y="132" class="label">NEXT MONTH</text><text x="407" y="160" class="metric">$27.4M</text>
    <rect x="550" y="119" width="82" height="20" rx="10" fill="#eff6ff"/><text x="591" y="133" text-anchor="middle" class="chip" fill="#1d4ed8">FORECAST</text>
    <text x="407" y="182" class="small">Synthetic planning view</text>

    <rect x="728" y="106" width="325" height="92" rx="10" fill="#fff" stroke="#cbd5e1"/>
    <text x="748" y="132" class="label">WHOLESALE DRIVER</text>
    <text x="748" y="160" class="value">Synthetic Plan +</text><text x="748" y="180" class="value">Governed Fallback</text>
    <circle cx="1018" cy="153" r="16" fill="#eff6ff"/><path d="M1011 153h14m-7-7v14" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>

    <rect x="1069" y="106" width="325" height="92" rx="10" fill="#fff" stroke="#cbd5e1"/>
    <text x="1089" y="132" class="label">RELEASE STATUS</text>
    <text x="1089" y="161" class="value">Approved</text><text x="1089" y="182" class="small">QA passed · reconciled</text>
    <circle cx="1359" cy="156" r="16" fill="#dcfce7"/><path d="m1352 156 5 5 10-12" fill="none" stroke="#16a34a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Main trend panel -->
  <rect x="46" y="216" width="675" height="270" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="66" y="246" class="panel-title">Revenue Trend</text>
  <text x="66" y="267" class="small">Synthetic Brand Revenue · Actual ≠ Nowcast ≠ Forecast</text>
  <rect x="456" y="233" width="57" height="19" rx="9" fill="#f1f5f9"/><text x="484" y="246" text-anchor="middle" class="chip" fill="#475569">ACTUAL</text>
  <rect x="519" y="233" width="68" height="19" rx="9" fill="#fff7ed"/><text x="553" y="246" text-anchor="middle" class="chip" fill="#9a3412">NOWCAST</text>
  <rect x="593" y="233" width="75" height="19" rx="9" fill="#eff6ff"/><text x="631" y="246" text-anchor="middle" class="chip" fill="#1d4ed8">FORECAST</text>
  <line x1="86" y1="432" x2="681" y2="432" stroke="#cbd5e1"/>
  <line x1="86" y1="315" x2="681" y2="315" stroke="#e2e8f0"/><line x1="86" y1="374" x2="681" y2="374" stroke="#e2e8f0"/>
  <rect x="400" y="283" width="72" height="149" fill="#fff7ed" opacity=".72"/><rect x="484" y="283" width="178" height="149" fill="#eff6ff" opacity=".65"/>

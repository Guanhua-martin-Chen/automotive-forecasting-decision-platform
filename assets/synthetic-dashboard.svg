    <rect x="121" y="365" width="42" height="67" fill="#2563eb"/><rect x="121" y="329" width="42" height="36" fill="#06b6d4"/><rect x="121" y="304" width="42" height="25" fill="#8b5cf6"/>
    <rect x="206" y="354" width="42" height="78" fill="#2563eb"/><rect x="206" y="314" width="42" height="40" fill="#06b6d4"/><rect x="206" y="286" width="42" height="28" fill="#8b5cf6"/>
    <rect x="291" y="344" width="42" height="88" fill="#2563eb"/><rect x="291" y="301" width="42" height="43" fill="#06b6d4"/><rect x="291" y="274" width="42" height="27" fill="#8b5cf6"/>
    <rect x="376" y="337" width="42" height="95" fill="#f59e0b"/><rect x="376" y="294" width="42" height="43" fill="#fb923c"/><rect x="376" y="267" width="42" height="27" fill="#fcd34d"/>
    <rect x="501" y="329" width="42" height="103" fill="#2563eb" opacity=".82"/><rect x="501" y="279" width="42" height="50" fill="#06b6d4" opacity=".82"/><rect x="501" y="249" width="42" height="30" fill="#8b5cf6" opacity=".82"/>
    <rect x="586" y="317" width="42" height="115" fill="#2563eb" opacity=".82"/><rect x="586" y="266" width="42" height="51" fill="#06b6d4" opacity=".82"/><rect x="586" y="235" width="42" height="31" fill="#8b5cf6" opacity=".82"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" role="img" aria-labelledby="title description">
  <title id="title">PIO Forecast Decision Platform synthetic dashboard</title>
  <desc id="description">A public-safe executive forecasting workspace showing three summary metrics, monthly revenue by brand, brand drivers, complementary Model and PLC planning views, top movers, and a governed release workflow.</desc>
  <style>
    .page-title { font: 700 24px Arial, sans-serif; fill: #172033; }
    .page-subtitle { font: 14px Arial, sans-serif; fill: #667085; }
    .section-title { font: 700 17px Arial, sans-serif; fill: #172033; }
    .section-subtitle { font: 13px Arial, sans-serif; fill: #667085; }
    .eyebrow { font: 700 11px Arial, sans-serif; fill: #667085; letter-spacing: .8px; }
    .metric { font: 700 29px Arial, sans-serif; fill: #172033; }
    .body { font: 13px Arial, sans-serif; fill: #344054; }
    .small { font: 12px Arial, sans-serif; fill: #667085; }
    .micro { font: 11px Arial, sans-serif; fill: #667085; }
    .chip { font: 700 11px Arial, sans-serif; letter-spacing: .25px; }
    .trend { font: 700 14px Arial, sans-serif; }
  </style>

  <rect width="1440" height="810" fill="#e9eef4"/>
  <rect x="20" y="18" width="1400" height="774" rx="18" fill="#ffffff" stroke="#cdd5df"/>

  <!-- Light executive header -->
  <text x="54" y="56" class="page-title">PIO Forecast Decision Platform</text>
  <text x="54" y="80" class="page-subtitle">Monthly accessory planning · Actual / Nowcast / Forecast</text>
  <rect x="1162" y="38" width="214" height="28" rx="14" fill="#eef4ff" stroke="#c7d7fe"/>
  <circle cx="1179" cy="52" r="4" fill="#2563eb"/>
  <text x="1191" y="56" class="chip" fill="#24459a">PUBLIC-SAFE SYNTHETIC DEMO</text>
  <line x1="46" y1="101" x2="1394" y2="101" stroke="#e4e7ec"/>

  <!-- Quiet status ribbon -->
  <rect x="46" y="115" width="1348" height="38" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <circle cx="68" cy="134" r="9" fill="#dcfce7"/>
  <path d="m64 134 3 3 6-7" fill="none" stroke="#15803d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="84" y="138" class="chip" fill="#166534">APPROVED FORECAST</text>
  <line x1="225" y1="124" x2="225" y2="144" stroke="#d0d5dd"/>
  <circle cx="247" cy="134" r="4" fill="#16a34a"/>
  <text x="258" y="138" class="chip" fill="#166534">QA PASSED</text>
  <line x1="352" y1="124" x2="352" y2="144" stroke="#d0d5dd"/>
  <circle cx="374" cy="134" r="4" fill="#2563eb"/>
  <text x="385" y="138" class="chip" fill="#344054">RECONCILED</text>
  <line x1="490" y1="124" x2="490" y2="144" stroke="#d0d5dd"/>
  <circle cx="512" cy="134" r="4" fill="#64748b"/>
  <text x="523" y="138" class="chip" fill="#344054">WHOLESALE INPUT CONTROLLED</text>
  <text x="1370" y="138" text-anchor="end" class="small">Governed monthly planning view</text>

  <!-- Three focused KPI cards -->
  <g>
    <rect x="46" y="169" width="434" height="88" rx="10" fill="#ffffff" stroke="#d0d5dd"/>
    <rect x="46" y="169" width="4" height="88" rx="2" fill="#e25555"/>
    <text x="70" y="194" class="eyebrow">CURRENT MONTH NOWCAST</text>
    <text x="70" y="228" class="metric">$24.8M</text>
    <text x="450" y="227" text-anchor="end" class="small">Month-to-date planning view</text>

    <rect x="503" y="169" width="434" height="88" rx="10" fill="#ffffff" stroke="#d0d5dd"/>
    <rect x="503" y="169" width="4" height="88" rx="2" fill="#2563eb"/>
    <text x="527" y="194" class="eyebrow">NEXT MONTH FORECAST</text>
    <text x="527" y="228" class="metric">$27.4M</text>
    <text x="907" y="227" text-anchor="end" class="small">Approved planning horizon</text>

    <rect x="960" y="169" width="434" height="88" rx="10" fill="#ffffff" stroke="#d0d5dd"/>
    <rect x="960" y="169" width="4" height="88" rx="2" fill="#16a34a"/>
    <text x="984" y="194" class="eyebrow">FORECAST STATUS</text>
    <text x="984" y="228" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#166534">APPROVED</text>
    <rect x="1243" y="193" width="125" height="28" rx="14" fill="#fff7ed"/>
    <text x="1305" y="211" text-anchor="middle" class="chip" fill="#9a3412">H1 WAPE 7.3%</text>
  </g>

  <!-- Revenue is the visual anchor: 67% width -->
  <rect x="46" y="275" width="900" height="265" rx="10" fill="#ffffff" stroke="#d0d5dd"/>
  <text x="70" y="307" class="section-title">Monthly Revenue by Brand</text>
  <text x="70" y="329" class="section-subtitle">Apr–Sep planning view · stacked brand mix</text>

  <!-- State legend -->
  <rect x="642" y="291" width="72" height="21" rx="10" fill="#f2f4f7"/>
  <text x="678" y="305" text-anchor="middle" class="chip" fill="#475467">ACTUAL</text>
  <rect x="721" y="291" width="86" height="21" rx="10" fill="#fff4f2" stroke="#fda29b"/>
  <text x="764" y="305" text-anchor="middle" class="chip" fill="#b42318">NOWCAST</text>
  <rect x="814" y="291" width="93" height="21" rx="10" fill="#eff4ff"/>
  <text x="860" y="305" text-anchor="middle" class="chip" fill="#24459a">FORECAST</text>

  <!-- Plot grid and time-state regions -->
  <line x1="86" y1="476" x2="908" y2="476" stroke="#cbd5e1"/>
  <line x1="86" y1="422" x2="908" y2="422" stroke="#edf0f3"/>
  <line x1="86" y1="368" x2="908" y2="368" stroke="#edf0f3"/>
  <rect x="487" y="342" width="112" height="134" rx="7" fill="#fff7f5" stroke="#fda29b" stroke-dasharray="4 4"/>
  <rect x="621" y="342" width="259" height="134" rx="7" fill="#f5f8ff"/>

  <!-- Actual bars: solid brand colors -->
  <g>
    <rect x="116" y="422" width="48" height="54" fill="#2563eb"/>
    <rect x="116" y="393" width="48" height="29" fill="#e25555"/>
    <rect x="116" y="375" width="48" height="18" fill="#64748b"/>

    <rect x="226" y="413" width="48" height="63" fill="#2563eb"/>
    <rect x="226" y="380" width="48" height="33" fill="#e25555"/>
    <rect x="226" y="361" width="48" height="19" fill="#64748b"/>

    <rect x="336" y="416" width="48" height="60" fill="#2563eb"/>
    <rect x="336" y="385" width="48" height="31" fill="#e25555"/>
    <rect x="336" y="367" width="48" height="18" fill="#64748b"/>
  </g>

  <!-- Nowcast: same brand colors, emphasized by border and backdrop -->
  <g>
    <rect x="519" y="411" width="48" height="65" fill="#2563eb"/>
    <rect x="519" y="377" width="48" height="34" fill="#e25555"/>
    <rect x="519" y="358" width="48" height="19" fill="#64748b"/>
    <rect x="516" y="355" width="54" height="124" rx="3" fill="none" stroke="#e25555" stroke-width="2"/>
  </g>

  <!-- Forecast: same brand colors at lighter opacity -->
  <g opacity=".55">
    <rect x="670" y="405" width="48" height="71" fill="#2563eb"/>
    <rect x="670" y="368" width="48" height="37" fill="#e25555"/>
    <rect x="670" y="348" width="48" height="20" fill="#64748b"/>

    <rect x="790" y="408" width="48" height="68" fill="#2563eb"/>
    <rect x="790" y="372" width="48" height="36" fill="#e25555"/>
    <rect x="790" y="353" width="48" height="19" fill="#64748b"/>
  </g>

  <g class="small" text-anchor="middle">
    <text x="140" y="497">Apr</text><text x="250" y="497">May</text><text x="360" y="497">Jun</text>
    <text x="543" y="497" fill="#b42318">Jul</text><text x="694" y="497" fill="#24459a">Aug</text><text x="814" y="497" fill="#24459a">Sep</text>
  </g>
  <g>
    <rect x="92" y="514" width="10" height="10" rx="2" fill="#2563eb"/><text x="109" y="523" class="small">Brand A</text>
    <rect x="178" y="514" width="10" height="10" rx="2" fill="#e25555"/><text x="195" y="523" class="small">Brand B</text>
    <rect x="264" y="514" width="10" height="10" rx="2" fill="#64748b"/><text x="281" y="523" class="small">Brand C</text>
  </g>

  <!-- Compact brand drivers instead of a second large table -->
  <rect x="964" y="275" width="430" height="265" rx="10" fill="#ffffff" stroke="#d0d5dd"/>
  <text x="988" y="307" class="section-title">Brand Drivers</text>
  <text x="988" y="329" class="section-subtitle">Mix contribution and per-vehicle direction</text>
  <text x="988" y="357" class="eyebrow">BRAND MIX</text>
  <text x="1281" y="357" class="eyebrow">PNVW</text>

  <text x="988" y="389" class="body">Brand A</text>
  <rect x="1061" y="378" width="182" height="11" rx="5.5" fill="#e9eefb"/>
  <rect x="1061" y="378" width="148" height="11" rx="5.5" fill="#2563eb"/>
  <text x="1252" y="389" class="body" font-weight="700">46%</text>
  <text x="1281" y="389" class="body" fill="#166534">Stable</text>

  <text x="988" y="431" class="body">Brand B</text>
  <rect x="1061" y="420" width="182" height="11" rx="5.5" fill="#fbeaea"/>
  <rect x="1061" y="420" width="110" height="11" rx="5.5" fill="#e25555"/>
  <text x="1252" y="431" class="body" font-weight="700">34%</text>
  <text x="1281" y="431" class="body" fill="#166534">Improving</text>

  <text x="988" y="473" class="body">Brand C</text>
  <rect x="1061" y="462" width="182" height="11" rx="5.5" fill="#eef0f3"/>
  <rect x="1061" y="462" width="65" height="11" rx="5.5" fill="#64748b"/>
  <text x="1252" y="473" class="body" font-weight="700">20%</text>
  <text x="1281" y="473" class="body" fill="#b42318">Softening</text>

  <line x1="988" y1="498" x2="1370" y2="498" stroke="#eaecf0"/>
  <text x="988" y="520" class="micro">Direction supports planning review; it is not a causal claim.</text>

  <!-- One integrated lower-level planning panel -->
  <rect x="46" y="557" width="1348" height="166" rx="10" fill="#ffffff" stroke="#d0d5dd"/>
  <text x="70" y="588" class="section-title">Planning Detail</text>
  <text x="196" y="588" class="section-subtitle">Complementary Model and PLC views support reconciled decisions</text>

  <line x1="686" y1="604" x2="686" y2="680" stroke="#e4e7ec"/>
  <text x="70" y="616" class="eyebrow">MODEL PLANNING</text>
  <text x="708" y="616" class="eyebrow">PLC PLANNING</text>

  <g class="body">
    <circle cx="78" cy="638" r="4" fill="#2563eb"/><text x="91" y="642">Model A</text><text x="610" y="642" text-anchor="end" class="trend" fill="#15803d">↑</text>
    <circle cx="78" cy="659" r="4" fill="#e25555"/><text x="91" y="663">Model B</text><text x="610" y="663" text-anchor="end" class="trend" fill="#667085">→</text>
    <circle cx="78" cy="680" r="4" fill="#64748b"/><text x="91" y="684">Model C</text><text x="610" y="684" text-anchor="end" class="trend" fill="#b42318">↓</text>

    <circle cx="716" cy="638" r="4" fill="#2563eb"/><text x="729" y="642">Category A</text><text x="1318" y="642" text-anchor="end" class="trend" fill="#15803d">↑</text>
    <circle cx="716" cy="659" r="4" fill="#e25555"/><text x="729" y="663">Category B</text><text x="1318" y="663" text-anchor="end" class="trend" fill="#15803d">↑</text>
    <circle cx="716" cy="680" r="4" fill="#64748b"/><text x="729" y="684">Category C</text><text x="1318" y="684" text-anchor="end" class="trend" fill="#b42318">↓</text>
  </g>

  <rect x="70" y="694" width="1300" height="20" rx="5" fill="#f8fafc"/>
  <text x="84" y="708" class="chip" fill="#344054">TOP MOVERS</text>
  <text x="222" y="708" class="body" fill="#166534">↑ Category A  +12%</text>
  <text x="448" y="708" class="body" fill="#166534">↑ Model B  +8%</text>
  <text x="649" y="708" class="body" fill="#b42318">↓ Category C  −6%</text>
  <text x="1348" y="708" text-anchor="end" class="micro">Signals shown as directional planning cues</text>

  <!-- Restrained governed workflow footer -->
  <rect x="46" y="740" width="1348" height="36" rx="8" fill="#172b4d"/>
  <g font-family="Arial, sans-serif" font-size="12" font-weight="700">
    <text x="70" y="762" fill="#ffffff">Validated</text><text x="135" y="762" fill="#8fb3ee">→</text>
    <text x="157" y="762" fill="#ffffff">Forecasted</text><text x="235" y="762" fill="#8fb3ee">→</text>
    <text x="257" y="762" fill="#ffffff">Reconciled</text><text x="332" y="762" fill="#8fb3ee">→</text>
    <text x="354" y="762" fill="#ffffff">QA</text><text x="380" y="762" fill="#8fb3ee">→</text>
    <text x="402" y="762" fill="#86efac">Approved</text>
  </g>
  <text x="1370" y="762" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">Illustrative interface using fabricated data. No Hyundai Mobis operational outputs are shown.</text>
</svg>
